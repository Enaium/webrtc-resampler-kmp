name: Publish

"on":
  workflow_dispatch:

# Publishes every artifact from the runner that can build it. Maven Central
# coordinates are immutable, so each `:jni-jvm-{classifier}` and each native
# target klib is published from exactly one runner:
#
#   macos-14      -> :resampler (android/jvm/macos/ios/tvos/watchos targets)
#                    :jni-jvm-darwin-aarch64, :jni-jvm-darwin-x86_64
#   ubuntu-latest -> :resampler linuxX64 + mingwX64 targets (static libs built
#                    here: linuxX64 natively, mingwX64 via MinGW-w64
#                    cross-compiler)
#                    :resampler androidNative targets (NDK cross-compiled)
#                    :jni-jvm-linux-x86_64, :jni-jvm-linux-aarch64
#   windows-latest -> :jni-jvm-windows-x86_64 (via MinGW)
#
# Trigger: run manually from the Actions tab (the workflow is dispatch only, so
# nothing runs on a push). Version comes from the root
# build.gradle.kts.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key

jobs:
  publish-macos:
    name: Publish macOS (multiplatform + darwin JNI)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish :resampler and :jni-jvm-darwin-*
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :resampler:publishAllPublicationsToMavenCentralRepository
          -x :resampler:publishLinuxX64PublicationToMavenCentralRepository
          -x :resampler:publishMingwX64PublicationToMavenCentralRepository
          -x :resampler:publishAndroidNativeArm64PublicationToMavenCentralRepository
          -x :resampler:publishAndroidNativeArm32PublicationToMavenCentralRepository
          -x :resampler:publishAndroidNativeX64PublicationToMavenCentralRepository
          -x :resampler:publishAndroidNativeX86PublicationToMavenCentralRepository
          :jni-jvm-darwin-aarch64:publishToMavenCentral
          :jni-jvm-darwin-x86_64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux (resampler linuxX64/mingwX64/androidNative + linux JNI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish :resampler linuxX64/mingwX64/androidNative and :jni-jvm-linux-{x86_64,aarch64}
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :resampler:publishLinuxX64PublicationToMavenCentralRepository
          :resampler:publishMingwX64PublicationToMavenCentralRepository
          :resampler:publishAndroidNativeArm64PublicationToMavenCentralRepository
          :resampler:publishAndroidNativeArm32PublicationToMavenCentralRepository
          :resampler:publishAndroidNativeX64PublicationToMavenCentralRepository
          :resampler:publishAndroidNativeX86PublicationToMavenCentralRepository
          :jni-jvm-linux-x86_64:publishToMavenCentral
          :jni-jvm-linux-aarch64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-windows:
    name: Publish Windows (windows JNI)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install MinGW
        shell: pwsh
        run: choco install mingw -y --no-progress

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Publish :jni-jvm-windows-x86_64
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
